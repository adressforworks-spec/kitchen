<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карта кухонь</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.6.1/ol.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --walnut: #3c2a1e;
    --walnut-deep: #241812;
    --cream: #f2ead9;
    --sage: #7c8a6e;
    --brass: #b8863b;
    --line: rgba(60,42,30,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;font-family:'Manrope',sans-serif;color:var(--walnut-deep);}
  #app{display:flex;height:100vh;width:100vw;overflow:hidden;position:relative;}

  #sidebar{
    width:380px;min-width:320px;background:var(--cream);
    display:flex;flex-direction:column;border-right:1px solid var(--line);z-index:10;
  }
  header{padding:28px 26px 18px;border-bottom:1px solid var(--line);}
  header h1{font-family:'Fraunces',serif;font-weight:600;font-size:28px;margin:0 0 6px;letter-spacing:-0.01em;}
  header p{margin:0;font-size:14px;color:#6b5a49;line-height:1.5;}

  #search-row{padding:16px 26px;border-bottom:1px solid var(--line);}
  #search-row input{
    width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:8px;
    font-family:'Manrope',sans-serif;font-size:14px;background:#fff;color:var(--walnut-deep);
  }
  #search-row input:focus{outline:2px solid var(--brass);outline-offset:1px;}

  #list{flex:1;overflow-y:auto;padding:8px 0;}
  .kitchen-card{padding:14px 26px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:12px;align-items:center;transition:background 0.15s ease;}
  .kitchen-card:hover{background:rgba(184,134,59,0.08);}
  .kitchen-card.active{background:rgba(184,134,59,0.14);}
  .swatch{width:14px;height:14px;border-radius:50%;flex-shrink:0;border:1px solid rgba(0,0,0,0.15);}
  .card-text h3{font-family:'Fraunces',serif;font-weight:500;font-size:15px;margin:0 0 3px;}
  .card-text p{font-size:12px;color:#6b5a49;margin:0;}
  #empty-state{padding:40px 26px;color:#8a7862;font-size:14px;line-height:1.6;}

  footer{padding:14px 26px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;}
  .btn{padding:12px;border-radius:8px;border:none;font-family:'Manrope',sans-serif;font-weight:600;font-size:14px;cursor:pointer;}
  .btn-primary{background:var(--walnut-deep);color:var(--cream);width:100%;}
  .btn-primary:hover{background:var(--walnut);}
  .btn-secondary{background:#eee5d5;color:var(--walnut-deep);width:100%;}
  .btn-secondary:hover{background:#e2d6bf;}
  .btn-danger{background:#fff;color:#a33;border:1px solid #d99;}
  .btn-place{background:#eee5d5;color:var(--walnut-deep);width:100%;margin-bottom:4px;}
  #admin-status{font-size:12px;color:#6b5a49;text-align:center;}

  #map-wrap{flex:1;height:100%;position:relative;}
  #map{width:100%;height:100%;}

  #place-banner{
    display:none;position:absolute;top:18px;left:50%;transform:translateX(-50%);
    background:var(--walnut-deep);color:var(--cream);padding:12px 20px;border-radius:9px;
    font-size:14px;font-weight:600;z-index:500;box-shadow:0 4px 16px rgba(0,0,0,0.25);
    align-items:center;gap:14px;
  }
  #place-banner.open{display:flex;}
  #place-banner button{background:var(--brass);color:#fff;border:none;border-radius:6px;padding:6px 12px;font-family:'Manrope',sans-serif;font-weight:600;font-size:13px;cursor:pointer;}

  .modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(36,24,18,0.55);
    align-items:center;justify-content:center;z-index:1000;padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal{background:#fff;border-radius:14px;padding:28px 30px;max-width:440px;width:100%;max-height:88vh;overflow-y:auto;}
  .modal h2{font-family:'Fraunces',serif;font-weight:600;font-size:22px;margin:0 0 18px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--walnut);margin-bottom:5px;}
  .field input, .field textarea{
    width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:7px;
    font-family:'Manrope',sans-serif;font-size:14px;color:var(--walnut-deep);background:#faf8f3;
  }
  .field textarea{resize:vertical;min-height:60px;}
  .field input:focus, .field textarea:focus{outline:2px solid var(--brass);outline-offset:1px;}
  .modal-actions{display:flex;gap:10px;margin-top:20px;}
  .modal-actions .btn{flex:1;}
  #location-status{font-size:13px;margin-top:6px;padding:8px 10px;border-radius:6px;background:#faf3e6;color:#6b5a49;}
  #location-status.set{background:rgba(124,138,110,0.14);color:var(--sage);font-weight:600;}
  #search-results{margin-top:6px;border:1px solid var(--line);border-radius:7px;overflow:hidden;max-height:180px;overflow-y:auto;}
  #search-results:empty{display:none;}
  .search-result-item{padding:9px 12px;font-size:13px;color:var(--walnut-deep);cursor:pointer;border-bottom:1px solid var(--line);background:#fff;}
  .search-result-item:last-child{border-bottom:none;}
  .search-result-item:hover{background:rgba(184,134,59,0.1);}
  .search-hint{padding:9px 12px;font-size:13px;color:#9a8a76;background:#fff;}
  #form-error, #login-error{font-size:13px;color:#a33;min-height:16px;margin-top:4px;}

  /* Photo thumbnails in the edit form */
  #photo-thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .photo-thumb{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--line);}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-thumb .remove-thumb{
    position:absolute;top:2px;right:2px;background:rgba(36,24,18,0.7);color:#fff;border:none;
    width:18px;height:18px;border-radius:50%;font-size:11px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }

  /* View modal (what visitors see when they click a marker) */
  .view-modal{max-width:680px;padding:0;display:flex;flex-wrap:wrap;overflow:hidden;}
  .view-photo{width:280px;flex:1 1 280px;display:flex;flex-direction:column;}
  .carousel-frame{
    position:relative;flex:1;min-height:220px;
    background:var(--cream);display:flex;align-items:center;justify-content:center;
  }
  .carousel-img{width:100%;height:100%;object-fit:cover;display:block;}
  .carousel-placeholder{
    color:#fff;font-family:'Manrope',sans-serif;font-weight:600;font-size:14px;
    display:flex;align-items:center;justify-content:center;width:100%;height:100%;
  }
  .carousel-arrow{
    position:absolute;top:50%;transform:translateY(-50%);background:rgba(36,24,18,0.55);color:#fff;
    border:none;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px;
    display:flex;align-items:center;justify-content:center;
  }
  .carousel-arrow.left{left:10px;}
  .carousel-arrow.right{right:10px;}
  .carousel-dots{display:flex;justify-content:center;gap:6px;padding:10px 0;background:#fff;}
  .carousel-dots .dot{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer;}
  .carousel-dots .dot.active{background:var(--brass);}
  .view-info{flex:1 1 300px;padding:28px 30px;position:relative;}
  .view-info .swatch-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .view-info .swatch-row .swatch{width:16px;height:16px;}
  .view-info .swatch-row span:last-child{font-size:13px;font-weight:600;color:var(--sage);}
  .view-info h2{font-family:'Fraunces',serif;font-weight:600;font-size:22px;margin:0 0 8px;}
  .view-info .view-address, .view-info .view-date{font-size:14px;color:#6b5a49;margin:0 0 4px;}
  .view-info .view-desc{font-size:14px;line-height:1.65;color:#4a3a2c;margin:14px 0 0;}
  #view-close-btn{
    position:absolute;top:16px;right:16px;background:var(--cream);border:none;
    width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px;color:var(--walnut-deep);
    display:flex;align-items:center;justify-content:center;z-index:5;
  }
  #view-close-btn:hover{background:#e2d6bf;}

  @media (max-width: 720px){
    #app{flex-direction:column;}
    #sidebar{width:100%;height:42%;min-width:0;border-right:none;border-bottom:1px solid var(--line);}
    #map-wrap{height:58%;}
    .view-modal{flex-direction:column;}
    .view-photo{width:100%;}
  }
</style>
</head>
<body>

<div id="app">
  <div id="sidebar">
    <header>
      <h1>Карта кухонь</h1>
      <p>Реализованные проекты — на карте. Нажмите на метку или карточку, чтобы посмотреть детали.</p>
    </header>
    <div id="search-row">
      <input type="text" id="search-input" placeholder="Поиск по адресу или названию…">

    <div id="list"></div>

    </footer>

  <div id="map-wrap">

    </div>

</div>

<!-- Login modal -->
<div class="modal-overlay" id="login-overlay">
  <div class="modal">
    <h2>Вход для администратора</h2>
    <div class="field">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" placeholder="you@example.com" autocomplete="username">
    </div>
    <div class="field">
      <label for="login-password">Пароль</label>
      <input type="password" id="login-password" placeholder="Пароль" autocomplete="current-password">
    </div>
    <div id="login-error"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="login-cancel">Отмена</button>
      <button class="btn btn-primary" id="login-submit">Войти</button>

  </div>
</div>

<!-- Add/Edit kitchen modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h2 id="modal-title">Новый проект</h2>
    <div class="field">
      <label for="f-name">Название / клиент</label>
      <input type="text" id="f-name" placeholder="Например: Кухня для семьи Ивановых">
    </div>
    <div class="field">
      <label for="f-address">Адрес (для подписи)</label>
      <input type="text" id="f-address" placeholder="Город, улица, дом">
    </div>
    <div class="field">
      <label for="f-color">Цвет кухни (название и/или #HEX)</label>
      <input type="text" id="f-color" placeholder="Например: Терракотовый, #C1440E">
    </div>
    <div class="field">
      <label for="f-search-address">Поиск адреса</label>
      <div style="display:flex;gap:8px;">
        <input type="text" id="f-search-address" placeholder="Например: Москва, ул. Тверская, 12" style="flex:1;">
        <button type="button" class="btn btn-secondary" id="search-address-btn" style="flex:0 0 auto;width:auto;padding:9px 16px;">Найти</button>
      </div>
      <div id="search-results"></div>
      <div class="hint" style="margin:8px 0 4px;">Или разместите метку вручную:</div>
      <button type="button" class="btn btn-place" id="place-btn">Указать кликом на карте</button>
      <div id="location-status">Метка ещё не размещена</div>
    </div>
    <div class="field">
      <label for="f-date">Дата сдачи проекта</label>
      <input type="text" id="f-date" placeholder="Например: Май 2026">
    </div>
    <div class="field">
      <label for="f-photo-file">Фото проекта (можно выбрать сразу несколько)</label>
      <input type="file" id="f-photo-file" accept="image/*" multiple>
      <div id="photo-thumbs"></div>
      <div id="photo-status" class="hint"></div>
    </div>
    <div class="field">
      <label for="f-desc">Описание</label>
      <textarea id="f-desc" placeholder="Материалы, стиль, особенности проекта…"></textarea>
    </div>
    <div id="form-error"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="cancel-btn">Отмена</button>
      <button class="btn btn-primary" id="save-btn">Сохранить</button>
    </div>
    <div id="delete-row" style="margin-top:10px;display:none;">
      <button class="btn btn-danger" id="delete-btn" style="width:100%;">Удалить проект</button>
    </div>
  </div>
</div>

<!-- View modal (what visitors see when they click a marker) -->
<div class="modal-overlay" id="view-overlay">
  <div class="modal view-modal">
    <div class="view-photo">
      <div class="carousel-frame" id="carousel-frame">
        <img class="carousel-img" id="carousel-img" style="display:none;">
        <div class="carousel-placeholder" id="carousel-placeholder">Фото нет</div>
        <button class="carousel-arrow left" id="carousel-prev" style="display:none;">‹</button>
        <button class="carousel-arrow right" id="carousel-next" style="display:none;">›</button>
      </div>
      <div class="carousel-dots" id="carousel-dots"></div>
    </div>
    <div class="view-info">
      <button id="view-close-btn">✕</button>
      <div class="swatch-row" id="view-swatch-row" style="display:none;">
        <span class="swatch" id="view-swatch"></span><span id="view-colorname"></span>
      </div>
      <h2 id="view-name"></h2>
      <p class="view-address" id="view-address"></p>
      <p class="view-date" id="view-date"></p>
      <p class="view-desc" id="view-desc"></p>
      <button class="btn btn-secondary" id="view-edit-btn" style="display:none;margin-top:16px;">Редактировать проект</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/ol@10.6.1/dist/ol.js"></script>
<script>
let kitchens = [];
let features = {};
let activeId = null;
let editingId = null;
let placingMode = false;
let pendingLatLng = null;
let pendingFeature = null;
let isAdmin = false;
let existingPhotos = [];
let viewPhotoPaths = [];
let viewResolvedUrls = [];
let viewIndex = 0;

const tileLayer = new ol.layer.Tile({ source: new ol.source.OSM() });
const vectorSource = new ol.source.Vector();
const vectorLayer = new ol.layer.Vector({ source: vectorSource });

const map = new ol.Map({
  target: 'map',
  layers: [tileLayer, vectorLayer],
  view: new ol.View({ center: ol.proj.fromLonLat([55, 56.5]), zoom: 4 })
});

function colorHexFrom(colorField){
  const match = (colorField || '').match(/#[0-9a-fA-F]{6}/);
  return match ? match[0] : '#b8863b';
}

function styleFor(color, pending){
  const dark = ['#f5f5f5','#e7dcc2','#ffffff'].includes(color.toLowerCase());
  return new ol.style.Style({
    image: new ol.style.Circle({
      radius: pending ? 10 : 9,
      fill: new ol.style.Fill({ color: pending ? '#7c8a6e' : color }),
      stroke: new ol.style.Stroke({ color: dark && !pending ? '#3c2a1e' : '#f2ead9', width: 2 })
    })
  });
}

map.on('click', (evt) => {
  if(placingMode){
    const lonlat = ol.proj.toLonLat(evt.coordinate);
    pendingLatLng = { lat: lonlat[1], lng: lonlat[0] };
    if(pendingFeature) vectorSource.removeFeature(pendingFeature);
    pendingFeature = new ol.Feature({ geometry: new ol.geom.Point(evt.coordinate) });
    pendingFeature.setStyle(styleFor('#7c8a6e', true));
    vectorSource.addFeature(pendingFeature);
    exitPlacingMode();
    document.getElementById('modal-overlay').classList.add('open');
    updateLocationStatus();
    return;
  }
  const feature = map.forEachFeatureAtPixel(evt.pixel, f => f);
  if(feature && feature.get('kitchenId') != null) selectKitchen(feature.get('kitchenId'));
});
map.on('pointermove', (evt) => {
  const hit = map.hasFeatureAtPixel(evt.pixel);
  map.getTargetElement().style.cursor = (hit || placingMode) ? 'pointer' : '';
});

// ---------- Firebase data sync (live for every visitor) ----------
db.ref('kitchens').on('value', (snapshot) => {
  const val = snapshot.val() || {};
  kitchens = Object.keys(val).map(id => ({ id, ...val[id] }));
  renderAll(document.getElementById('search-input').value);
});

function renderAll(filterText=''){
  vectorSource.clear();
  features = {};
  const listEl = document.getElementById('list');
  listEl.innerHTML = '';

  const ft = filterText.trim().toLowerCase();
  const filtered = kitchens.filter(k =>
    !ft || (k.name||'').toLowerCase().includes(ft) || (k.address||'').toLowerCase().includes(ft)
  );

  if(filtered.length === 0){
    listEl.innerHTML = '<div id="empty-state">Пока нет проектов. Войдите как администратор, чтобы добавить первую кухню.</div>';
  }

  filtered.forEach(k => {
    const hex = colorHexFrom(k.color);
    if(k.lat != null && k.lng != null){
      const feature = new ol.Feature({ geometry: new ol.geom.Point(ol.proj.fromLonLat([k.lng, k.lat])) });
      feature.set('kitchenId', k.id);
      feature.setStyle(styleFor(hex, false));
      vectorSource.addFeature(feature);
      features[k.id] = feature;
    }
    const card = document.createElement('div');
    card.className = 'kitchen-card' + (k.id === activeId ? ' active' : '');
    card.innerHTML = `<span class="swatch" style="background:${hex}"></span>
      <div class="card-text"><h3>${escapeHtml(k.name)}</h3><p>${escapeHtml(k.address)}</p></div>`;
    card.addEventListener('click', () => selectKitchen(k.id));
    listEl.appendChild(card);
  });
}

function selectKitchen(id){
  activeId = id;
  const k = kitchens.find(x => x.id === id);
  if(k && k.lat != null && k.lng != null){
    map.getView().animate({ center: ol.proj.fromLonLat([k.lng, k.lat]), zoom: 13, duration: 500 });
  }
  renderAll(document.getElementById('search-input').value);
  openView(k);
}

function photosOf(k){
  if(Array.isArray(k.photos) && k.photos.length) return k.photos;
  if(k.photo) return [k.photo];
  return [];
}

async function openView(k){
  viewPhotoPaths = photosOf(k);
  viewIndex = 0;
  editingId = k.id;
  const hex = colorHexFrom(k.color);
  const swatchRow = document.getElementById('view-swatch-row');
  if(k.color){
    swatchRow.style.display = 'flex';
    document.getElementById('view-swatch').style.background = hex;
    document.getElementById('view-colorname').textContent = k.color;
  }else{
    swatchRow.style.display = 'none';
  }
  document.getElementById('view-name').textContent = k.name || '';
  document.getElementById('view-address').textContent = k.address || '';
  document.getElementById('view-date').textContent = k.date || '';
  document.getElementById('view-date').style.display = k.date ? 'block' : 'none';
  document.getElementById('view-desc').textContent = k.desc || '';
  document.getElementById('view-edit-btn').style.display = isAdmin ? 'block' : 'none';

  viewResolvedUrls = [];
  document.getElementById('carousel-img').style.display = 'none';
  document.getElementById('carousel-placeholder').style.display = 'flex';
  document.getElementById('carousel-placeholder').textContent = viewPhotoPaths.length ? 'Загрузка фото…' : 'Фото нет';
  document.getElementById('carousel-prev').style.display = 'none';
  document.getElementById('carousel-next').style.display = 'none';
  document.getElementById('carousel-dots').innerHTML = '';
  document.getElementById('view-overlay').classList.add('open');

  if(viewPhotoPaths.length){
    const openedForId = k.id;
    viewResolvedUrls = await Promise.all(viewPhotoPaths.map(resolvePhotoUrl));
    if(editingId === openedForId) renderCarousel();
  }
}

function renderCarousel(){
  const img = document.getElementById('carousel-img');
  const placeholder = document.getElementById('carousel-placeholder');
  const prevBtn = document.getElementById('carousel-prev');
  const nextBtn = document.getElementById('carousel-next');
  const dotsEl = document.getElementById('carousel-dots');

  if(viewResolvedUrls.length === 0){
    img.style.display = 'none';
    placeholder.style.display = 'flex';
    placeholder.textContent = 'Фото нет';
    prevBtn.style.display = 'none';
    nextBtn.style.display = 'none';
    dotsEl.innerHTML = '';
    return;
  }

  placeholder.style.display = 'none';
  img.style.display = 'block';
  img.src = viewResolvedUrls[viewIndex];

  const multi = viewResolvedUrls.length > 1;
  prevBtn.style.display = multi ? 'flex' : 'none';
  nextBtn.style.display = multi ? 'flex' : 'none';

  dotsEl.innerHTML = '';
  if(multi){
    viewResolvedUrls.forEach((_, i) => {
      const dot = document.createElement('div');
      dot.className = 'dot' + (i === viewIndex ? ' active' : '');
      dot.addEventListener('click', () => { viewIndex = i; renderCarousel(); });
      dotsEl.appendChild(dot);
    });
  }
}

document.getElementById('carousel-prev').addEventListener('click', () => {
  viewIndex = (viewIndex - 1 + viewResolvedUrls.length) % viewResolvedUrls.length;
  renderCarousel();
});
document.getElementById('carousel-next').addEventListener('click', () => {
  viewIndex = (viewIndex + 1) % viewResolvedUrls.length;
  renderCarousel();
});
document.getElementById('view-close-btn').addEventListener('click', () => {
  document.getElementById('view-overlay').classList.remove('open');
});
document.getElementById('view-overlay').addEventListener('click', (e) => {
  if(e.target.id === 'view-overlay') document.getElementById('view-overlay').classList.remove('open');
});
document.getElementById('view-edit-btn').addEventListener('click', () => {
  const k = kitchens.find(x => x.id === editingId);
  document.getElementById('view-overlay').classList.remove('open');
  openDetail(k);
});

function openDetail(k){
  document.getElementById('modal-title').textContent = 'Проект';
  editingId = k.id;
  document.getElementById('f-name').value = k.name || '';
  document.getElementById('f-address').value = k.address || '';
  document.getElementById('f-color').value = k.color || '';
  document.getElementById('f-date').value = k.date || '';
  document.getElementById('f-desc').value = k.desc || '';
  document.getElementById('form-error').textContent = '';
  document.getElementById('f-search-address').value = '';
  document.getElementById('search-results').innerHTML = '';
  existingPhotos = photosOf(k).slice();
  document.getElementById('f-photo-file').value = '';
  document.getElementById('photo-status').textContent = '';
  renderPhotoThumbs();
  pendingLatLng = (k.lat != null && k.lng != null) ? {lat:k.lat, lng:k.lng} : null;
  updateLocationStatus();
  document.getElementById('delete-row').style.display = isAdmin ? 'block' : 'none';
  setFormEditable(isAdmin);
  document.getElementById('modal-overlay').classList.add('open');
}

async function renderPhotoThumbs(){
  const wrap = document.getElementById('photo-thumbs');
  wrap.innerHTML = '';
  const paths = existingPhotos.slice();
  const thumbs = paths.map((path, i) => {
    const thumb = document.createElement('div');
    thumb.className = 'photo-thumb';
    wrap.appendChild(thumb);
    return { thumb, path, i };
  });
  for(const { thumb, path, i } of thumbs){
    const url = await resolvePhotoUrl(path);
    thumb.innerHTML = `<img src="${url}">` + (isAdmin ? `<button type="button" class="remove-thumb" data-i="${i}">✕</button>` : '');
  }
  wrap.querySelectorAll('.remove-thumb').forEach(btn => {
    btn.addEventListener('click', () => {
      existingPhotos.splice(parseInt(btn.dataset.i, 10), 1);
      renderPhotoThumbs();
    });
  });
}
  wrap.querySelectorAll('.remove-thumb').forEach(btn => {
    btn.addEventListener('click', () => {
      existingPhotos.splice(parseInt(btn.dataset.i, 10), 1);
      renderPhotoThumbs();
    });
  });
}

function setFormEditable(editable){
  ['f-name','f-address','f-color','f-date','f-photo-file','f-desc','place-btn','f-search-address','search-address-btn'].forEach(id => {
    document.getElementById(id).disabled = !editable;
  });
  document.getElementById('save-btn').style.display = editable ? 'block' : 'none';
}

function openNew(){
  document.getElementById('modal-title').textContent = 'Новый проект';
  editingId = null;
  document.getElementById('f-name').value = '';
  document.getElementById('f-address').value = '';
  document.getElementById('f-color').value = '';
  document.getElementById('f-date').value = '';
  document.getElementById('f-desc').value = '';
  document.getElementById('form-error').textContent = '';
  document.getElementById('f-search-address').value = '';
  document.getElementById('search-results').innerHTML = '';
  existingPhotos = [];
  document.getElementById('f-photo-file').value = '';
  document.getElementById('photo-status').textContent = '';
  renderPhotoThumbs();
  pendingLatLng = null;
  updateLocationStatus();
  document.getElementById('delete-row').style.display = 'none';
  setFormEditable(true);
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(){
  document.getElementById('modal-overlay').classList.remove('open');
  exitPlacingMode();
}

function updateLocationStatus(){
  const el = document.getElementById('location-status');
  if(pendingLatLng){
    el.textContent = `Метка размещена (${pendingLatLng.lat.toFixed(5)}, ${pendingLatLng.lng.toFixed(5)})`;
    el.classList.add('set');
  }else{
    el.textContent = 'Метка ещё не размещена';
    el.classList.remove('set');
  }
}

function enterPlacingMode(){
  placingMode = true;
  document.getElementById('modal-overlay').classList.remove('open');
  document.getElementById('place-banner').classList.add('open');
  if(pendingFeature){ vectorSource.removeFeature(pendingFeature); pendingFeature = null; }
  if(pendingLatLng){
    pendingFeature = new ol.Feature({ geometry: new ol.geom.Point(ol.proj.fromLonLat([pendingLatLng.lng, pendingLatLng.lat])) });
    pendingFeature.setStyle(styleFor('#7c8a6e', true));
    vectorSource.addFeature(pendingFeature);
  }
}
function exitPlacingMode(){
  placingMode = false;
  document.getElementById('place-banner').classList.remove('open');
}

document.getElementById('place-cancel').addEventListener('click', () => {
  exitPlacingMode();
  document.getElementById('modal-overlay').classList.add('open');
});
document.getElementById('place-btn').addEventListener('click', enterPlacingMode);

document.getElementById('f-photo-file').addEventListener('change', (e) => {
  const n = e.target.files.length;
  document.getElementById('photo-status').textContent = n ? `Выбрано новых фото: ${n}` : '';
});

async function uploadPhotoToSupabase(file){
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const path = `${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
  const { error } = await sb.storage.from(PHOTOS_BUCKET).upload(path, file);
  if(error) throw new Error(error.message);
  return path; // сохраняем путь, а не прямую ссылку — ссылку получаем каждый раз заново
}

async function getSignedUrl(path){
  const { data, error } = await sb.storage.from(PHOTOS_BUCKET).createSignedUrl(path, 3600);
  if(error){ console.error(error); return ''; }
  return data.signedUrl;
}

// Старые записи могли хранить прямую ссылку (например, с ImgBB) — показываем как есть,
// а новые (путь в Supabase Storage) — превращаем во временную подписанную ссылку.
async function resolvePhotoUrl(pathOrUrl){
  if(/^https?:\/\//i.test(pathOrUrl)) return pathOrUrl;
  return await getSignedUrl(pathOrUrl);
}

// ---------- Address search (Nominatim) ----------
async function runAddressSearch(){
  const q = document.getElementById('f-search-address').value.trim();
  const resultsEl = document.getElementById('search-results');
  if(!q){ resultsEl.innerHTML = ''; return; }
  resultsEl.innerHTML = '<div class="search-hint">Ищем…</div>';
  try{
    const url = `https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=6&accept-language=ru&q=${encodeURIComponent(q)}`;
    const res = await fetch(url);
    const results = await res.json();
    if(!results.length){
      resultsEl.innerHTML = '<div class="search-hint">Ничего не найдено. Уточните адрес или разместите метку вручную.</div>';
      return;
    }
    resultsEl.innerHTML = '';
    results.forEach(r => {
      const item = document.createElement('div');
      item.className = 'search-result-item';
      item.textContent = r.display_name;
      item.addEventListener('click', () => {
        pendingLatLng = { lat: parseFloat(r.lat), lng: parseFloat(r.lon) };
        if(pendingFeature){ vectorSource.removeFeature(pendingFeature); pendingFeature = null; }
        pendingFeature = new ol.Feature({ geometry: new ol.geom.Point(ol.proj.fromLonLat([pendingLatLng.lng, pendingLatLng.lat])) });
        pendingFeature.setStyle(styleFor('#7c8a6e', true));
        vectorSource.addFeature(pendingFeature);
        map.getView().animate({ center: ol.proj.fromLonLat([pendingLatLng.lng, pendingLatLng.lat]), zoom: 16, duration: 500 });
        updateLocationStatus();
        resultsEl.innerHTML = '';
      });
      resultsEl.appendChild(item);
    });
  }catch(e){
    resultsEl.innerHTML = '<div class="search-hint">Ошибка поиска. Попробуйте ещё раз или разместите метку вручную.</div>';
  }
}
document.getElementById('search-address-btn').addEventListener('click', runAddressSearch);
document.getElementById('f-search-address').addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){ e.preventDefault(); runAddressSearch(); }
});
document.getElementById('add-btn').addEventListener('click', openNew);
document.getElementById('cancel-btn').addEventListener('click', closeModal);
document.getElementById('modal-overlay').addEventListener('click', (e) => {
  if(e.target.id === 'modal-overlay') closeModal();
});
document.getElementById('search-input').addEventListener('input', (e) => {
  renderAll(e.target.value);
});

document.getElementById('save-btn').addEventListener('click', async () => {
  const errEl = document.getElementById('form-error');
  const photoStatusEl = document.getElementById('photo-status');
  errEl.textContent = '';
  photoStatusEl.textContent = '';
  if(!isAdmin){ errEl.textContent = 'Войдите как администратор.'; return; }

  const name = document.getElementById('f-name').value.trim();
  const address = document.getElementById('f-address').value.trim();
  const color = document.getElementById('f-color').value.trim();
  const date = document.getElementById('f-date').value.trim();
  const desc = document.getElementById('f-desc').value.trim();
  const photoFiles = Array.from(document.getElementById('f-photo-file').files);

  if(!name || !address){ errEl.textContent = 'Укажите название и адрес.'; return; }
  if(!pendingLatLng){ errEl.textContent = 'Укажите расположение на карте кнопкой «Указать на карте».'; return; }

  let newUrls = [];
  if(photoFiles.length){
    document.getElementById('save-btn').disabled = true;
    try{
      for(let i = 0; i < photoFiles.length; i++){
        photoStatusEl.textContent = `Загружаем фото ${i + 1} из ${photoFiles.length}…`;
        newUrls.push(await uploadPhotoToSupabase(photoFiles[i]));
      }
    }catch(e){
      document.getElementById('save-btn').disabled = false;
      photoStatusEl.textContent = '';
      errEl.textContent = 'Не удалось загрузить фото: ' + e.message;
      return;
    }
    document.getElementById('save-btn').disabled = false;
    photoStatusEl.textContent = '';
  }
  const photos = existingPhotos.concat(newUrls);

  const data = { name, address, color, date, photos, desc, lat: pendingLatLng.lat, lng: pendingLatLng.lng };

  try{
    if(editingId){
      await db.ref('kitchens/' + editingId).update(data);
    }else{
      await db.ref('kitchens').push(data);
    }
  }catch(e){
    errEl.textContent = 'Не удалось сохранить: ' + e.message;
    return;
  }

  if(pendingFeature){ vectorSource.removeFeature(pendingFeature); pendingFeature = null; }
  closeModal();
});

document.getElementById('delete-btn').addEventListener('click', async () => {
  if(!isAdmin) return;
  if(!confirm('Удалить этот проект с карты?')) return;
  try{
    await db.ref('kitchens/' + editingId).remove();
  }catch(e){
    document.getElementById('form-error').textContent = 'Не удалось удалить: ' + e.message;
    return;
  }
  if(pendingFeature){ vectorSource.removeFeature(pendingFeature); pendingFeature = null; }
  closeModal();
  activeId = null;
});

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}
