<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Кухни — портфолио</title>
<link rel="preconnect" href="https://unpkg.com"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root{--bg:#f5f5f2;--card:#fff;--text:#171717;--muted:#707070;--line:#e4e4df;--accent:#171717}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}header{position:sticky;top:0;z-index:20;background:rgba(245,245,242,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.head{max-width:1400px;margin:auto;padding:18px 24px;display:flex;gap:24px;align-items:center}.brand{font-size:22px;font-weight:800;letter-spacing:-.04em}.stats{color:var(--muted);font-size:14px}.search{margin-left:auto;min-width:260px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;font-size:15px;outline:none}.wrap{max-width:1400px;margin:auto;padding:22px 24px}.layout{display:grid;grid-template-columns:1fr 390px;gap:20px}.mapbox{height:520px;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#ddd;position:sticky;top:88px}.notice{padding:12px 15px;background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:14px;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;transition:.15s}.card:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,.07)}.cover{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#eee}.body{padding:14px}.title{font-weight:750;line-height:1.25}.addr{font-size:13px;color:var(--muted);margin-top:7px;line-height:1.35}.count{font-size:12px;color:var(--muted);margin-top:10px}.empty{padding:30px;text-align:center;color:var(--muted)}.modal{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);padding:20px;overflow:auto}.modal.open{display:flex;align-items:center;justify-content:center}.panel{width:min(1050px,100%);background:#fff;border-radius:22px;overflow:hidden;max-height:94vh}.modalhead{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:flex-start}.modalhead h2{margin:0;font-size:21px}.close{margin-left:auto;border:0;background:#eee;border-radius:10px;width:38px;height:38px;font-size:22px;cursor:pointer}.modaladdr{color:var(--muted);font-size:13px;margin-top:7px}.photos{padding:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;overflow:auto}.photos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:#eee;cursor:zoom-in}.actions{padding:0 18px 18px;display:flex;gap:10px}.btn{display:inline-block;text-decoration:none;color:#fff;background:#171717;border-radius:11px;padding:11px 14px;font-size:14px}.leaflet-popup-content{margin:12px}.citybtn{border:0;background:#171717;color:#fff;border-radius:8px;padding:7px 10px;cursor:pointer;margin-top:7px}@media(max-width:950px){.layout{grid-template-columns:1fr}.mapbox{position:relative;top:auto;height:390px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.search{min-width:0;width:180px}}@media(max-width:560px){.head{padding:14px}.wrap{padding:14px}.stats{display:none}.search{width:150px}.grid{grid-template-columns:1fr}.photos{grid-template-columns:repeat(2,1fr)}.modal{padding:8px}}
</style></head>
<body>
<header><div class="head"><div class="brand">Кухни</div><div class="stats" id="stats"></div><input id="search" class="search" placeholder="Поиск по проектам…"></div></header>
<main class="wrap"><div class="layout"><section><div class="notice">Статическая версия портфолио. Все фотографии находятся внутри сайта. Точные координаты в исходных данных не указаны, поэтому карта показывает проекты по населённым пунктам, а точный адрес можно открыть в карте.</div><div id="grid" class="grid"></div></section><aside><div id="map" class="mapbox"></div></aside></div></main>
<div id="modal" class="modal"><div class="panel"><div class="modalhead"><div><h2 id="mtitle"></h2><div id="maddr" class="modaladdr"></div></div><button class="close" id="close">×</button></div><div id="photos" class="photos"></div><div class="actions"><a id="maps" class="btn" target="_blank" rel="noopener">Открыть адрес на карте</a></div></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const CITY={
 'Москва':[55.7558,37.6173],'Долгопрудный':[55.9386,37.5144],'Мытищи':[55.9105,37.7364],'Красногорск':[55.8310,37.3300],'Химки':[55.8887,37.4304],'Королёв':[55.9162,37.8545],'Лобня':[56.0120,37.4740],'Балашиха':[55.7963,37.9382],'Пушкино':[56.0104,37.8472],'Кимры':[56.8734,37.3557]
};
let projects=[],filtered=[];const $=s=>document.querySelector(s);
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function cityOf(address){let s=address||'';let m=s.match(/г\.?\s*([А-ЯЁ][а-яё-]+)/);if(m)return m[1];for(const k of Object.keys(CITY))if(s.includes(k))return k;return null}
function card(p){return `<article class="card" data-id="${p.id}"><img class="cover" loading="lazy" src="${p.photos[0]}" alt=""><div class="body"><div class="title">${esc(p.title)}</div><div class="addr">${esc(p.address||'Адрес не указан')}</div><div class="count">${p.photos.length} фото</div></div></article>`}
function render(){filtered=projects.filter(p=>(p.title+' '+p.address).toLowerCase().includes($('#search').value.toLowerCase().trim()));$('#grid').innerHTML=filtered.length?filtered.map(card).join(''):'<div class="empty">Ничего не найдено</div>';document.querySelectorAll('.card').forEach(c=>c.onclick=()=>openProject(c.dataset.id));}
function openProject(id){const p=projects.find(x=>x.id===id);if(!p)return;$('#mtitle').textContent=p.title;$('#maddr').textContent=p.address||'Адрес не указан';$('#photos').innerHTML=p.photos.map(x=>`<img src="${x}" loading="lazy" alt="" onclick="window.open(this.src,'_blank')">`).join('');$('#maps').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.address||p.title);$('#modal').classList.add('open')}
$('#close').onclick=()=>$('#modal').classList.remove('open');$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('open')};$('#search').oninput=render;
fetch('projects.json').then(r=>r.json()).then(data=>{projects=data;$('#stats').textContent=`${projects.length} проектов · ${projects.reduce((a,p)=>a+p.photos.length,0)} фото`;render();initMap()});
function initMap(){const map=L.map('map').setView([55.75,37.62],9);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);const groups={};projects.forEach(p=>{const c=cityOf(p.address);if(c&&CITY[c]){groups[c]??=[];groups[c].push(p)}});Object.entries(groups).forEach(([city,arr])=>{const m=L.marker(CITY[city]).addTo(map);m.bindPopup(`<b>${esc(city)}</b><br>${arr.length} проектов<br><button class="citybtn" onclick="filterCity('${city.replace(/'/g,"\\'")}')">Показать проекты</button>`)});window._map=map}
function filterCity(city){$('#search').value=city;render();window.scrollTo({top:0,behavior:'smooth'})}
</script></body></html>
